<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Saver - Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="editor-container">
    <header class="toolbar">
      <div class="brand">
        <img src="icons/icon48.png" alt="Logo">
        <span>Image Editor</span>
      </div>
      
      <div class="tools">
        <button id="toolMove" class="tool-btn active" title="Move/Pan">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"></path><path d="M14 10V4a2 2 0 0 0-4 0v6"></path><path d="M10 10.5V3a2 2 0 0 0-4 0v9"></path><path d="M6 13.5V10a2 2 0 0 0-4 0v2.7A10.8 10.8 0 0 0 7.8 22h5.5A7.8 7.8 0 0 0 21 14.2V11a2 2 0 0 0-4 0v1"></path></svg>
        </button>
        <button id="toolDraw" class="tool-btn" title="Draw">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
        </button>
        <button id="toolArrow" class="tool-btn" title="Arrow">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
        </button>
        <button id="toolRect" class="tool-btn" title="Rectangle">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
        </button>
        <div class="divider"></div>
        <input type="color" id="colorPicker" value="#ff0000" title="Pick Color">
        <input type="range" id="lineWidth" min="1" max="20" value="4" title="Line Width">
        <div class="divider"></div>
        <button id="btnUndo" class="tool-btn" title="Undo">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        </button>
        <button id="btnClear" class="tool-btn" title="Clear Edits">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
        <div class="divider"></div>
        <button id="btnRemoveBg" class="tool-btn ai-btn" title="Remove Background (Requires API Key)">
          <svg style="margin-right:4px;" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2"></path><path d="M15 16v-2"></path><path d="M8 9h2"></path><path d="M20 9h2"></path><path d="M17.8 11.8l1.4 1.4"></path><path d="M10.8 4.8l1.4 1.4"></path><path d="M17.8 6.2l1.4-1.4"></path><path d="M10.8 13.2l1.4-1.4"></path><path d="M3 21l9-9"></path><path d="M12.2 11.8l1.6 1.6"></path></svg>
          Remove BG
        </button>
      </div>

      <div class="actions">
        <select id="exportFormat">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPG</option>
          <option value="image/webp">WebP</option>
        </select>
        <button id="btnDownload" class="primary-btn">Download Image</button>
      </div>
    </header>

    <main class="canvas-area">
      <div id="loading" class="loading-overlay">Loading Image...</div>
      <canvas id="editorCanvas"></canvas>
    </main>
  </div>

  <script src="editor.js"></script>
</body>
</html>
